[project]
name = "tla-cli"
dynamic = ["version"]
description = "Command line tool to simplify working with TLA+"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.3.0",
    "packaging>=25.0",
    "pydantic>=2.12.1",
    "pyyaml>=6.0",
    "rich-click>=1.9.2",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "google-generativeai>=0.8.0",
    "mistralai>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
tla = "tla_cli.cli:cli"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["tla_cli"]
artifacts = ["tla_cli/tools"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
exclude = ["tla_cli/tools"]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
exclude = ["tla_cli/tools/"]
ignore_missing_imports = true
