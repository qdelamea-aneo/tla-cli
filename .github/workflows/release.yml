name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  build-universal-wheel:
    name: Build universal wheel (JARs only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Build universal wheel
        # Force a linux build on a non-x86_64 arch so TLAPM bundling is skipped
        # and the hook produces a py3-none-any wheel containing only the JARs.
        run: uv build --wheel
        env:
          # Override platform so the hook sees an unsupported arch and skips TLAPM.
          TLAPM_SKIP_BUNDLE: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-universal
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-universal-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
